<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Music Player - Dark Theme</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
          --bg-outer: #0a0b0e;
          --window-bg: #121318;
          --card-bg: #1c1e24;
          --text-main: #f8fafc;
          --text-muted: #64748b;
          --text-dim: #475569;
          --accent: #818cf8;
          --accent-glow: rgba(129, 140, 248, 0.3);
          --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
          --border-color: rgba(255, 255, 255, 0.08);
          --track-rail: #262933;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
          background-color: var(--bg-outer);
          color: var(--text-main);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          overflow: hidden;
        }

        /* macOS Window Container */
        .app-window {
          width: 960px;
          height: 660px;
          background: var(--window-bg);
          border-radius: 20px;
          border: 1px solid var(--border-color);
          box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
        }

        /* Window Header */
        .window-header {
          height: 52px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
          flex-shrink: 0;
          background: rgba(18, 19, 24, 0.8);
          backdrop-filter: blur(10px);
        }

        .window-dots {
          display: flex;
          gap: 8px;
        }

        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .window-title {
          font-size: 0.95rem;
          font-weight: 700;
          color: var(--text-main);
          letter-spacing: -0.2px;
        }

        .theme-toggle {
          font-size: 1.1rem;
          color: var(--accent);
          cursor: pointer;
          transition: transform 0.2s;
        }

        .theme-toggle:hover {
          transform: rotate(15deg);
        }

        /* Main Grid Layout */
        .app-body {
          flex: 1;
          display: grid;
          grid-template-columns: 420px 1fr;
          overflow: hidden;
          padding: 0 32px 32px 32px;
          gap: 32px;
        }

        /* Left Control Panel */
        .left-panel {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding-top: 8px;
        }

        .artwork-section {
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        /* Album Art Frame / Placeholder State */
        .album-art {
          width: 280px;
          height: 280px;
          border-radius: 20px;
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          display: flex;
          justify-content: center;
          align-items: center;
          box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
          position: relative;
          overflow: hidden;
        }

        .album-art i {
          font-size: 5rem;
          color: var(--accent);
          filter: drop-shadow(0 0 20px var(--accent-glow));
        }

        .track-meta {
          text-align: center;
          margin-top: 20px;
          width: 100%;
        }

        .song-title {
          font-size: 1.3rem;
          font-weight: 700;
          color: var(--text-main);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .artist-name {
          font-size: 0.9rem;
          color: var(--text-muted);
          margin-top: 4px;
          font-weight: 500;
        }

        /* Controls & Sliders */
        .controls-wrapper {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }

        /* Progress Bar */
        .timeline-container {
          width: 100%;
        }

        .progress-bar {
          width: 100%;
          height: 4px;
          background: var(--track-rail);
          border-radius: 2px;
          position: relative;
          cursor: pointer;
        }

        .progress-fill {
          width: 0%;
          height: 100%;
          background: var(--accent-gradient);
          border-radius: 2px;
          position: relative;
        }

        .progress-fill::after {
          content: '';
          position: absolute;
          right: -6px;
          top: 50%;
          transform: translateY(-50%);
          width: 12px;
          height: 12px;
          background: #fff;
          border-radius: 50%;
          box-shadow: 0 0 10px var(--accent);
        }

        .time-labels {
          display: flex;
          justify-content: space-between;
          font-size: 0.75rem;
          color: var(--text-muted);
          margin-top: 8px;
          font-weight: 500;
        }

        /* Buttons */
        .playback-buttons {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0 12px;
        }

        .playback-buttons i {
          font-size: 1.25rem;
          color: var(--text-muted);
          cursor: pointer;
          transition: all 0.2s ease;
        }

        .playback-buttons i:hover {
          color: var(--text-main);
        }

        .play-btn {
          width: 52px;
          height: 52px;
          background: var(--accent-gradient);
          color: #fff !important;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.4rem !important;
          box-shadow: 0 8px 24px var(--accent-glow);
        }

        .play-btn:hover {
          transform: scale(1.05);
        }

        /* Volume Bar */
        .volume-container {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 4px;
        }

        .volume-container i {
          font-size: 1rem;
          color: var(--text-muted);
        }

        .volume-bar {
          flex: 1;
          height: 4px;
          background: var(--track-rail);
          border-radius: 2px;
          position: relative;
          cursor: pointer;
        }

        .volume-fill {
          width: 65%;
          height: 100%;
          background: var(--text-muted);
          border-radius: 2px;
        }

        /* Right Empty State / Lyrics Panel */
        .right-panel {
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
        }

        .no-lyrics-state {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          color: var(--text-dim);
        }

        .no-lyrics-state i {
          font-size: 2.5rem;
          opacity: 0.5;
        }

        .no-lyrics-state span {
          font-size: 1rem;
          font-weight: 600;
          letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

<div class="app-window">
    <!-- Window Header -->
    <div class="window-header">
        <div class="window-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
        </div>
        <div class="window-title">YL Music Player</div>
        <i class="bi bi-moon-stars-fill theme-toggle"></i>
    </div>

    <!-- App Body -->
    <div class="app-body">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="artwork-section">
                <div class="album-art">
                    <i class="bi bi-music-note"></i>
                </div>
                <div class="track-meta">
                    <h1 class="song-title">Unknown Title</h1>
                    <p class="artist-name">Unknown Artist</p>
                </div>
            </div>

            <div class="controls-wrapper">
                <!-- Timeline -->
                <div class="timeline-container">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="time-labels">
                        <span>00:00</span>
                        <span>00:00</span>
                    </div>
                </div>

                <!-- Playback Buttons -->
                <div class="playback-buttons">
                    <i class="bi bi-repeat"></i>
                    <i class="bi bi-skip-start-fill"></i>
                    <div class="play-btn">
                        <i class="bi bi-play-fill" style="margin-left: 2px;"></i>
                    </div>
                    <i class="bi bi-skip-end-fill"></i>
                    <i class="bi bi-list-task"></i>
                </div>

                <!-- Volume Bar -->
                <div class="volume-container">
                    <i class="bi bi-volume-up-fill"></i>
                    <div class="volume-bar">
                        <div class="volume-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Empty Lyrics State -->
        <div class="right-panel">
            <div class="no-lyrics-state">
                <i class="bi bi-file-earmark-music"></i>
                <span>No Lyrics Available</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
